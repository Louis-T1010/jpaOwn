services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/dockerfile
    command: sleep infinity
    volumes:
      - ..:/workspaces
    depends_on:
      - db

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: practice_db
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: